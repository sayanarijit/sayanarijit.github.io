---
layout: default
---

<header class="post-header">
  {% if title %}
  <h1 class="post-title">{{ title }}</h1>
  {% endif %}
  <p class="post-meta">
    {% if page.date %}
    <time datetime="{{ page.date | _date: 'iso' }}">
      🗓️ {{ page.date | date_est: false }}
    </time>
    {% endif %}
  </p>
  {% include 'tags.html' %}
</header>

<article class="post-content">
  {{ content }}
</article>

<hr />

{% include 'webmentions.html' %}

<hr />

<a
  target="_blank"
  rel="noreferrer noopener nofollow"
  href="{{ page.url | edit_note }}"
>
  ✏️ Edit this post
</a>
